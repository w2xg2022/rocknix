name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        uses: actions/download-artifact@v8
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          cat build.emu-libretro.tar.part* > build.emu-libretro.tar
          tar -xf build.emu-libretro.tar

      - name: Clean up compressed emu-libretro file
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          cat build.emu-standalone.tar.part* > build.emu-standalone.tar
          tar --skip-old-files -xf build.emu-standalone.tar

      - name: Clean up compressed emu-standalone file
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      - name: Clean retroarch
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean retroarch"
      # clean to rebuild emulationstation with credentials
      - name: Clean emulationstation
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean emulationstation"

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Brand the board-Specific image with the model name
        if: ${{ inputs.BOARD != '' }}
        env:
          BOARD: ${{ inputs.BOARD }}
        run: |
          shopt -s nullglob
          # Only a single-BOARD build yields a truly board-specific image: get_fdt
          # points the *-Specific image's extlinux at that one board's own dtb.
          # With multiple boards there is still just one *-Specific image but it
          # autodetects among the built dtbs (fdtdir), so it is NOT one model ->
          # leave its generic name untouched.
          if [ "$(echo ${BOARD} | wc -w)" -ne 1 ]; then
            echo "multiple boards -> keep generic -Specific name"; exit 0
          fi
          # Swap only the -Specific suffix for the model, keeping the
          # ROCKNIX-<DEVICE>.<arch>-<date>- prefix:
          #   ...-<date>-Specific.img.gz -> ...-<date>-MD1000.img.gz
          MODEL=$(echo "${BOARD}" | sed 's/^rk[0-9]*-//' | tr '[:lower:]' '[:upper:]')
          for f in target/ROCKNIX-*-Specific.img.gz; do
            nf="${f/-Specific.img.gz/-${MODEL}.img.gz}"
            echo "brand: $f -> $nf"
            # gzip stores the ORIGINAL filename in its header, so a plain rename
            # of the .gz leaves the inner file as ...-Specific.img (visible in
            # WinRAR / after gunzip). Recompress with `gzip -n` (no stored name)
            # so decompressors fall back to the archive basename -> ...-<MODEL>.img.
            gunzip -c "$f" | gzip -n > "$nf"
            rm -f "$f" "${f}.sha256"
            ( cd target && sha256sum "$(basename "$nf")" > "$(basename "$nf").sha256" )
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      # es4all: 把这次的成品镜像发回 distribution-cache 的 userspace-base-<DEVICE>，作为
      # A(kernel)/B(ES4All-L4)/C(inject) 三条快车道注入用的底 —— 从此每次 full build 自动
      # 保鲜，不必再手动 seed。此前它落后一个 build，B/C 会把新东西疊在缺修正的旧底上。
      # 取机型专属镜像(排除 -Generic)；~1.1GB < 2GB 单档即可，无需切片。
      - name: Stage image as userspace-base (for A/B/C lanes)
        run: |
          BASE_IMG=$(ls target/ROCKNIX-*.img.gz 2>/dev/null | grep -v -- '-Generic' | head -1)
          if [ -z "${BASE_IMG}" ]; then
            echo "::warning::no device-specific image found -> skip userspace-base publish"; exit 0
          fi
          echo "publishing ${BASE_IMG} as userspace-base-${{ inputs.DEVICE }}.img.gz"
          cp "${BASE_IMG}" "userspace-base-${{ inputs.DEVICE }}.img.gz"
          ls -la "userspace-base-${{ inputs.DEVICE }}.img.gz"
        continue-on-error: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: userspace-base-${{ inputs.DEVICE }}
          files: userspace-base-${{ inputs.DEVICE }}.img.gz
          make_latest: false
          prerelease: true
          body: userspace base image for the A/B/C fast lanes (auto-refreshed by every full build)
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-update-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.tar
            target/ROCKNIX-*.tar.sha256
          compression-level: 0
          if-no-files-found: error
