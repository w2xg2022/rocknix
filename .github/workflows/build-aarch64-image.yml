name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      # es4all: must match build-aarch64.yml. This job runs build_distro, so the
      # image metapackage is re-evaluated here too -- leaving the default (yes)
      # would just move the debug/benchmark builds into this job instead of
      # removing them.
      DEBUG_PACKAGES: no
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # es4all: fastlane-base is a whole finished firmware for one model, so it
      # has to be named per board. It carries no fingerprint of its own -- the
      # A/B/C lanes just fetch it by tag and inject into it -- so a second RK3566
      # board would quietly overwrite the first one's, and lane B would then lay
      # a fresh ES onto some *other* model's firmware and ship it. That failure
      # is invisible until the thing is flashed, which is why the board goes in
      # the name now rather than when a second board shows up.
      #
      # Same derivation as the image branding further down (rk3566-md1000 ->
      # MD1000). It has to be injective -- with no fingerprint to fall back on,
      # two BOARDs sharing a slug means one model's firmware served as another's.
      # Blank really is "every board under DEVICE"; a list of two is not, so they
      # cannot both be "all".
      - name: Compute board slug
        id: slug
        run: |
          case "$(echo '${{ inputs.BOARD }}' | wc -w)" in
            0) SLUG=all ;;
            1) SLUG=$(echo '${{ inputs.BOARD }}' | sed 's/^rk[0-9]*-//' | tr '[:lower:]' '[:upper:]') ;;
            *) SLUG="MULTI-$(echo '${{ inputs.BOARD }}' | tr ' ' '\n' | LC_ALL=C sort | sha256sum | cut -c1-8)" ;;
          esac
          echo "SLUG=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "board slug: ${SLUG}"

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        uses: actions/download-artifact@v8
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' && inputs.DEVICE != 'RK3566' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          cat build.emu-libretro.tar.part* > build.emu-libretro.tar
          tar -xf build.emu-libretro.tar

      - name: Clean up compressed emu-libretro file
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          cat build.emu-standalone.tar.part* > build.emu-standalone.tar
          tar --skip-old-files -xf build.emu-standalone.tar

      - name: Clean up compressed emu-standalone file
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      #
      # es4all: only worth doing where 32-bit is actually on. emu-standalone
      # builds retroarch with ENABLE_32BIT=no pinned in its job env, so this
      # job cleans it to pick up 32-bit support from the device's options.
      # RK3566 sets ENABLE_32BIT="no" (devices/RK3566/options) and this job does
      # not override it, so the rebuild produces a byte-identical retroarch --
      # it even re-downloads the source first. Measured at ~7m of the image
      # job's 49m on a full RK3566 build, for nothing.
      - name: Clean retroarch
        if: ${{ inputs.DEVICE != 'RK3566' }}
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean retroarch"
      # es4all: the emulationstation clean that used to sit here is gone. It
      # existed because the credentials are compiled in and calculate_stamp does
      # not hash them, so the only way to be sure a key change took effect was to
      # force a rebuild -- at the cost of recompiling ES on every single build
      # (~19m of this job's 49m) to reproduce what build-aarch64 already built.
      # build-aarch64 now gets the credentials itself and ES sets PKG_STAMP from
      # them, so a rotated key rebuilds on its own and this job can just install
      # what it was handed. Assembling, not recompiling, is this job's purpose.

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      # es4all: ES's system list comes from the emulators package. If ES ever
      # also installs its "not an emulation device" stub es_systems.cfg, which of
      # the two lands in the image is a race -- scripts/image assembles it with
      # start_multithread_build, which sets MTWITHLOCKS=yes and so skips the
      # ordered dependency install that would otherwise put emulators last.
      # Losing that race ships a firmware whose ES lists nothing but Tools, and
      # it looks perfectly healthy until someone boots it. Fail loudly instead.
      - name: Verify the system list survived
        run: |
          BT=build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          shopt -s nullglob
          stub=(${BT}/install_pkg/emulationstation-*/usr/config/emulationstation/es_systems.cfg)
          if [ ${#stub[@]} -gt 0 ]; then
            echo "::error::emulationstation installed ${stub[0]} -- it would race the emulators package's real es_systems.cfg"
            exit 1
          fi
          real=(${BT}/install_pkg/emulators-*/usr/config/emulationstation/es_systems.cfg)
          if [ ${#real[@]} -eq 0 ]; then
            echo "::error::the emulators package installed no es_systems.cfg"
            exit 1
          fi
          n=$(grep -c '<system>' "${real[0]}" || true)
          echo "${real[0]}: ${n} systems"
          if [ "${n}" -lt 10 ]; then
            echo "::error::only ${n} systems -- expected the full list"
            exit 1
          fi

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Brand the board-Specific image with the model name
        if: ${{ inputs.BOARD != '' }}
        env:
          BOARD: ${{ inputs.BOARD }}
        run: |
          shopt -s nullglob
          # Only a single-BOARD build yields a truly board-specific image: get_fdt
          # points the *-Specific image's extlinux at that one board's own dtb.
          # With multiple boards there is still just one *-Specific image but it
          # autodetects among the built dtbs (fdtdir), so it is NOT one model ->
          # leave its generic name untouched.
          if [ "$(echo ${BOARD} | wc -w)" -ne 1 ]; then
            echo "multiple boards -> keep generic -Specific name"; exit 0
          fi
          # Swap only the -Specific suffix for the model, keeping the
          # ROCKNIX-<DEVICE>.<arch>-<date>- prefix:
          #   ...-<date>-Specific.img.gz -> ...-<date>-MD1000.img.gz
          MODEL=$(echo "${BOARD}" | sed 's/^rk[0-9]*-//' | tr '[:lower:]' '[:upper:]')
          for f in target/ROCKNIX-*-Specific.img.gz; do
            nf="${f/-Specific.img.gz/-${MODEL}.img.gz}"
            echo "brand: $f -> $nf"
            # gzip stores the ORIGINAL filename in its header, so a plain rename
            # of the .gz leaves the inner file as ...-Specific.img (visible in
            # WinRAR / after gunzip). Recompress with `gzip -n` (no stored name)
            # so decompressors fall back to the archive basename -> ...-<MODEL>.img.
            gunzip -c "$f" | gzip -n > "$nf"
            rm -f "$f" "${f}.sha256"
            ( cd target && sha256sum "$(basename "$nf")" > "$(basename "$nf").sha256" )
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      # es4all: 把这次的成品镜像发回 distribution-cache 的 fastlane-base-<DEVICE>，作为
      # A(kernel)/B(ES4All-L4)/C(inject) 三条快车道注入用的底 —— 从此每次 full build 自动
      # 保鲜，不必再手动 seed。此前它落后一个 build，B/C 会把新东西疊在缺修正的旧底上。
      # 取机型专属镜像(排除 -Generic)；~1.1GB < 2GB 单档即可，无需切片。
      - name: Stage image as fastlane-base (for A/B/C lanes)
        run: |
          BASE_IMG=$(ls target/ROCKNIX-*.img.gz 2>/dev/null | grep -v -- '-Generic' | head -1)
          if [ -z "${BASE_IMG}" ]; then
            echo "::warning::no device-specific image found -> skip fastlane-base publish"; exit 0
          fi
          echo "publishing ${BASE_IMG} as fastlane-base-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.img.gz"
          cp "${BASE_IMG}" "fastlane-base-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.img.gz"
          ls -la "fastlane-base-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.img.gz"
        continue-on-error: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: fastlane-base-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}
          files: fastlane-base-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.img.gz
          make_latest: false
          prerelease: true
          body: userspace base image for the A/B/C fast lanes (auto-refreshed by every full build)
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-update-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.tar
            target/ROCKNIX-*.tar.sha256
          compression-level: 0
          if-no-files-found: error
