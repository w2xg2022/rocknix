name: Build toolchain

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64-toolchain:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-toolchain-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # es4all: 复用本 job 自己发布到 distribution-cache 的 toolchain-tree
      # (toolchain + host tools + .stamps)。.stamps 在 -> 下面 build_mt toolchain
      # 跳过重编(~40min 省下),抓不到就照旧走 ccache 编译。此前该还原逻辑只写在
      # 方案C(build-kernel-image.yml),full build 的本 job 只当生产者、从不消费。
      #
      # es4all: gated on a config fingerprint, like the userland tree.
      #
      # Restoring this tree is less dangerous than it looks: the Build step below
      # is deliberately NOT gated on reused, so build_mt still walks every
      # toolchain package and scripts/build re-derives PKG_DEEPHASH from each
      # one's own files. Bump gcc and it does get rebuilt.
      #
      # The hole is the one calculate_stamp always has: it hashes a package's
      # files and nothing else, so it cannot see the build config. Change a
      # compiler flag in options and every stamp still matches -- the whole
      # toolchain is silently carried over, and every package built against it
      # afterwards inherits the wrong flags. Narrow, but it fails quietly and it
      # poisons everything downstream, so it gets the same key as the userland.
      - name: Compute config fingerprint
        id: fp
        run: |
          FP=$( { cat projects/${{ inputs.PROJECT }}/options \
                      projects/${{ inputs.PROJECT }}/devices/${{ inputs.DEVICE }}/options \
                      distributions/${{ inputs.PROJECT }}/options 2>/dev/null
                  echo "P=${{ inputs.PROJECT }} D=${{ inputs.DEVICE }} A=${ARCH}"
                  echo "BUST=${{ vars.CACHE_BUST }}"
                } | sha256sum | cut -c1-16 )
          echo "FP=${FP}" >> "$GITHUB_OUTPUT"
          echo "config fingerprint: ${FP}"

      - name: Reuse prebuilt toolchain tree
        id: tc
        run: |
          CACHE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/toolchain-tree"
          WANT="${{ steps.fp.outputs.FP }}"
          HAVE=$(curl -L --fail --silent "${CACHE}/toolchain-tree-aarch64-${{ inputs.DEVICE }}.fp" 2>/dev/null || echo "")
          echo "want=${WANT}  cached=${HAVE:-<none>}"
          if [ -z "${HAVE}" ] || [ "${HAVE}" != "${WANT}" ]; then
            echo "reused=0" >> "$GITHUB_OUTPUT"
            echo "::notice::config fingerprint does not match the cached toolchain -> compiling from ccache"
            exit 0
          fi
          BASE="${CACHE}/toolchain-tree-aarch64-${{ inputs.DEVICE }}.tar.zst"
          rm -f tc.tar.zst; i=0
          while :; do
            SUF=$(printf "%02d" "$i")
            if curl -L --fail --retry 3 -o part "${BASE}.part${SUF}" 2>/dev/null; then
              cat part >> tc.tar.zst; rm -f part; i=$((i+1))
            else
              break
            fi
          done
          if [ "$i" -gt 0 ] && tar --zstd -tf tc.tar.zst >/dev/null 2>&1; then
            tar --zstd -xf tc.tar.zst && rm -f tc.tar.zst
            echo "reused=1" >> "$GITHUB_OUTPUT"
            echo "restored toolchain tree from $i part(s) -> skipping toolchain compile"
          else
            rm -f tc.tar.zst
            echo "reused=0" >> "$GITHUB_OUTPUT"
            echo "no usable toolchain tree -> will compile from ccache"
          fi

      - name: Retrieve ccache
        if: steps.tc.outputs.reused != '1'
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."            

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt toolchain alsa-lib llvm:host"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.tc.outputs.reused != '1'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 500M
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.tc.outputs.reused != '1'
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache

      - name: Save ccache
        if: steps.tc.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Compress directory
        run: |
          tar --zstd -cf build.aarch64-toolchain.tar.zst \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})
          path: build.aarch64-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error

      # Also publish the toolchain tree to distribution-cache so the standalone
      # Option C workflow (build-kernel-image.yml) can curl+reuse it and skip
      # rebuilding the toolchain (~30min saved per kernel-only iteration).
      # GitHub release assets are capped at 2GB and the tree is ~3GB, so split
      # into <2GB numbered parts (.part00, .part01, ...); Option C cats them back.
      # es4all: 复用了现成 tree 时不必重新发布(内容没变),跳过省 ~3GB 上传。
      - name: Split toolchain tree for Option C reuse
        if: steps.tc.outputs.reused != '1'
        run: |
          split -b 1900m -d --suffix-length=2 build.aarch64-toolchain.tar.zst \
            toolchain-tree-aarch64-${{ inputs.DEVICE }}.tar.zst.part
          echo "${{ steps.fp.outputs.FP }}" > toolchain-tree-aarch64-${{ inputs.DEVICE }}.fp
          ls -la toolchain-tree-aarch64-${{ inputs.DEVICE }}.tar.zst.part* \
                 toolchain-tree-aarch64-${{ inputs.DEVICE }}.fp

      # Consumers walk .part00, .part01, ... until one 404s, so a leftover part
      # from a larger previous tree would be concatenated onto a smaller new one
      # and silently corrupt it. Drop only the parts this upload will not
      # replace, so a failed upload cannot leave the cache emptied instead.
      - name: Drop stale toolchain-tree parts
        if: steps.tc.outputs.reused != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CACHE: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          NEW=$(ls toolchain-tree-aarch64-${{ inputs.DEVICE }}.tar.zst.part* 2>/dev/null | xargs -n1 basename)
          gh release view toolchain-tree -R "${CACHE}" --json assets -q '.assets[].name' 2>/dev/null \
            | grep "^toolchain-tree-aarch64-${{ inputs.DEVICE }}\.tar\.zst\.part" \
            | while read -r a; do
                if ! echo "${NEW}" | grep -qx "$a"; then
                  echo "dropping stale ${a}"
                  gh release delete-asset toolchain-tree "$a" -R "${CACHE}" -y || true
                fi
              done
        continue-on-error: true

      - uses: softprops/action-gh-release@v3
        if: steps.tc.outputs.reused != '1'
        with:
          tag_name: toolchain-tree
          files: toolchain-tree-aarch64-${{ inputs.DEVICE }}.tar.zst.part*
          make_latest: false
          prerelease: true
          body: prebuilt toolchain trees (toolchain + host tools + .stamps) for Option C kernel-image reuse
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      # Publish the fingerprint only once the tree is up: it is the gate the next
      # run reads, so landing it first and then failing to upload the tree would
      # send that run to a stale or half-written snapshot.
      - name: Save toolchain-tree fingerprint
        if: steps.tc.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: toolchain-tree
          files: toolchain-tree-aarch64-${{ inputs.DEVICE }}.fp
          make_latest: false
          prerelease: true
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true