name: Build emu-libretro

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64-emu-libretro:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      TARGET_TYPE: cores_only
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      # This job builds no dtb, but the emulator closure pulls in `linux`, whose
      # PKG_STAMP is derived from the dtb list -- which get_kernel_make_extracmd()
      # derives from BOARD. Leave it unset and the stamp disagrees with the one
      # build-aarch64 wrote, and the whole kernel gets recompiled here for nothing.
      # See build-device.yml for the full story.
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.aarch64.tar

      - name: Download build aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 build (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64 build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.build.aarch64.tar

      - name: Download qt6 (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' || inputs.DEVICE == 'S922X' || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' }}
        uses: actions/download-artifact@v8
        with:
          name: qt6 (${{ inputs.DEVICE }})

      - name: Extract artifact qt6
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' || inputs.DEVICE == 'S922X' || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            sudo tar --zstd -xf build.qt6.tar.zst --same-owner
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed qt6 file
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' || inputs.DEVICE == 'S922X' || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' }}
        run: rm build.qt6.tar.zst

      # === es4all: emulator slice reuse =========================================
      # The emulators are rebuilt from scratch on every run (~50-60m) even though
      # only ~3 of our last 40 commits touched them. Cache their build outputs and
      # restore them when nothing they depend on has changed.
      #
      # Correctness rests on three facts, each verified against the build system:
      #   1. build-aarch64 sets EMULATION_DEVICE=no, and virtual/image/package.mk
      #      only pulls in "emulators" when it is yes -> the userland tree we just
      #      extracted contains NO emulator packages at all.
      #   2. .stamps/<pkg> is keyed by package NAME only (no version), so the set
      #      difference below is exactly the emulator packages. install_pkg dirs
      #      carry -<version>, which is why the difference is taken over .stamps.
      #   3. scripts/build re-derives PKG_DEEPHASH from each package's own files
      #      and rebuilds on mismatch, so a restored stamp still rebuilds that
      #      package if its package.mk changed. What the stamp does NOT cover is
      #      build config and dependency changes -- that is what the key handles.
      - name: Snapshot the userland package set
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          ls "${BT}/.stamps" 2>/dev/null | LC_ALL=C sort > /tmp/ul-stamps.txt || : > /tmp/ul-stamps.txt
          echo "userland packages in tree: $(wc -l < /tmp/ul-stamps.txt)"

      - name: Compute emulator cache key
        id: key
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          # UL_ID = what the emulators actually compile and link against.
          # emulationstation and rocknix are excluded because nothing depends on
          # them (verified: no PKG_DEPENDS_TARGET in the tree references either --
          # the rocknix-* hits are separate packages). They are also the two we
          # edit most, so excluding them is what makes this cache hit at all.
          # Anything else changing (an SDL2 bump from an upstream sync, say)
          # changes the key and correctly forces a full emulator rebuild.
          UL_ID=$(for s in "${BT}"/.stamps/*/build_target; do
                    [ -f "$s" ] || continue
                    p=$(basename "$(dirname "$s")")
                    case "$p" in emulationstation|rocknix) continue ;; esac
                    printf '%s %s\n' "$p" "$(sed -n 's/^STAMP_PKG_DEEPHASH=//p' "$s")"
                  done | LC_ALL=C sort | sha256sum | cut -c1-16)
          EMU_FP=$( { cat projects/${{ inputs.PROJECT }}/packages/virtual/emulators/package.mk \
                          projects/${{ inputs.PROJECT }}/options \
                          projects/${{ inputs.PROJECT }}/devices/${{ inputs.DEVICE }}/options 2>/dev/null
                      echo "TT=${TARGET_TYPE} E32=${ENABLE_32BIT} DEV=${{ inputs.DEVICE }} ARCH=${ARCH} BUST=${{ vars.CACHE_BUST }}"
                    } | sha256sum | cut -c1-16)
          echo "KEY=${UL_ID}-${EMU_FP}" >> "$GITHUB_OUTPUT"
          echo "emu cache key: ${UL_ID}-${EMU_FP}  (userland=${UL_ID} config=${EMU_FP})"

      - name: Restore emulator slice
        id: slice
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/emu-slice"
          NAME="emu-slice-libretro-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar"
          found=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            curl -L --fail --silent --show-error -o "slice.part-${suffix}" "${BASE}/${NAME}.part-${suffix}" || break
            found=1
          done
          if [ "$found" -eq 0 ]; then
            rm -f slice.part-*
            echo "::notice::no emulator slice for this key -> building from source"
            exit 0
          fi
          cat slice.part-* > slice.tar && rm -f slice.part-*
          # Validate before unpacking: a truncated/half-published slice must fail
          # here rather than land a half-populated tree on the image job.
          tar -tf slice.tar >/dev/null || { echo "::warning::slice corrupt -> building from source"; rm -f slice.tar; exit 0; }
          tar -xf slice.tar && rm -f slice.tar
          echo "reused=1" >> "$GITHUB_OUTPUT"
          echo "restored emulator packages:"
          comm -13 /tmp/ul-stamps.txt <(ls "${BT}/.stamps" | LC_ALL=C sort) | tr '\n' ' '; echo
        continue-on-error: true

      - name: Retrieve ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt emulators"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-emu-libretro)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-emu-libretro)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      # Publish the slice for the next run. Only the emulator packages go in:
      # they are exactly the ones whose stamps were not in the userland tree we
      # started from. Keeping the userland out is what makes restoring the slice
      # unable to clobber a freshly built userland package on a later run.
      - name: Publish emulator slice
        if: steps.slice.outputs.reused != '1'
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          comm -13 /tmp/ul-stamps.txt <(ls "${BT}/.stamps" | LC_ALL=C sort) > /tmp/emu-pkgs.txt
          if [ ! -s /tmp/emu-pkgs.txt ]; then
            echo "::warning::no emulator packages appeared -> nothing to publish"; exit 0
          fi
          echo "publishing $(wc -l < /tmp/emu-pkgs.txt) emulator packages"
          : > /tmp/slice-files.txt
          while read -r p; do
            echo "${BT}/.stamps/${p}" >> /tmp/slice-files.txt
            for d in "${BT}"/install_pkg/"${p}"-*; do
              # `|| continue`, not `&& echo`: with the default `bash -e`, an
              # unmatched glob would make the AND-list the loop's failing last
              # command and abort the step.
              [ -e "$d" ] || continue
              echo "$d" >> /tmp/slice-files.txt
            done
          done < /tmp/emu-pkgs.txt
          sudo tar -cf - -T /tmp/slice-files.txt \
            | split -b 1900m - "emu-slice-libretro-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar.part-"
          ls -la emu-slice-*.part-* || true
        continue-on-error: true

      - name: Save emulator slice
        if: steps.slice.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: emu-slice
          files: "emu-slice-libretro-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar.part-*"
          make_latest: false
          prerelease: true
          body: emulator build slices, keyed by userland+config fingerprint
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Clean up slice parts
        if: always()
        run: rm -f emu-slice-*.tar.part-*

      - name: Clean ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          tar -cf ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache

      - name: Save ccache
        if: steps.slice.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: | 
          sudo tar --remove-files -cf - \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps | split -b 2G -  build.emu-libretro.tar.part

      - uses: actions/upload-artifact@v7
        with:
          name: emu-libretro (${{ inputs.DEVICE }})
          path: build.emu-libretro.tar.part*
          if-no-files-found: error