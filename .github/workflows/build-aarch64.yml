name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # es4all: 复用上次 build 发布的 aarch64 树(userland + .stamps)。stamps 在 ->
      # build_distro 只重编有改动的套件、其余全跳过(与 toolchain-tree 同一招:44m->7m)。
      # 树的格式与 es-sysroot / L4 相同(= build.aarch64.tar,不含 build/ 子目录);需要
      # 重编的套件会自行重新解压源码到 build/。抓不到或损坏就照旧全量编译(有 fallback)。
      # 本 job 结尾会把新树发回 es-sysroot,故每次 build 自动保鲜、L4 也一起受益。
      - name: Reuse prebuilt aarch64 tree (es-sysroot)
        id: tree
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/es-sysroot/es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst"
          rm -f es.tar.zst; i=0
          while :; do
            SUF=$(printf "%02d" "$i")
            if curl -L --fail --retry 3 -o part "${BASE}.part${SUF}" 2>/dev/null; then
              cat part >> es.tar.zst; rm -f part; i=$((i+1))
            else
              break
            fi
          done
          if [ "$i" -gt 0 ] && tar --zstd -tf es.tar.zst >/dev/null 2>&1; then
            tar --zstd -xf es.tar.zst && rm -f es.tar.zst
            echo "reused=1" >> "$GITHUB_OUTPUT"
            echo "restored aarch64 tree from $i part(s) -> unchanged packages will be skipped"
          else
            rm -f es.tar.zst
            echo "reused=0" >> "$GITHUB_OUTPUT"
            echo "no usable aarch64 tree -> full userland build"
          fi

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."     

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        run: |
          tar --zstd -xf build.aarch64-toolchain.tar.zst

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_distro "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-base-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Build modules
        if: ${{ inputs.DEVICE == 'RK3326' || inputs.DEVICE == 'H700' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt modules "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-modules)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-modules
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache  

      - name: Save ccache
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files \
          -cf build.build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build
          sudo tar --remove-files \
          -cf build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: build.aarch64.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 build (${{ inputs.DEVICE }})
          path: build.build.aarch64.tar
          if-no-files-found: error

      # es4all: 把这次的 aarch64 树发回 distribution-cache 的 es-sysroot，供下次 build 的
      # "Reuse prebuilt aarch64 tree" 与 L4(build-es-image) 复用 —— es-sysroot 从此每次
      # full build 自动保鲜，不必再手动 seed(原本停在 2026-07-07 十天没动)。
      # >2GB 用 split 切片(与 toolchain-tree 同)。万一残留旧切片导致 cat 出损坏档，
      # 还原端有 `tar --zstd -tf` 校验 + 全量编译 fallback，不会污染产物。
      - name: Publish aarch64 tree to es-sysroot
        run: |
          zstd -T0 -3 -c build.aarch64.tar > es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst
          split -b 1900m -d --suffix-length=2 es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst \
            es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst.part
          rm -f es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst
          ls -la es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst.part*
        continue-on-error: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: es-sysroot
          files: es-sysroot-aarch64-${{ inputs.DEVICE }}.tar.zst.part*
          make_latest: false
          prerelease: true
          body: prebuilt aarch64 trees (userland + .stamps) for build-aarch64 reuse and L4 (build-es-image)
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
