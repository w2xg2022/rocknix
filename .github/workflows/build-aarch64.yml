name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    env:
      # Do not "tidy" these into quoted strings. Bare no is a YAML 1.1 boolean,
      # so the container receives EMULATION_DEVICE=false, not "no". Everything
      # that gates on = "yes" behaves as intended, but emulationstation's stub
      # es_systems.cfg is written on = "no" -- which never matches today. Quote
      # it and that stub starts being installed, racing the emulators package's
      # real system list during the multithreaded image assembly; lose the race
      # and the firmware boots to an ES with nothing but Tools in it.
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      # es4all: EMULATION_DEVICE=no above is how this job keeps the emulators
      # out of its own build -- it is not a claim about the device. Packages that
      # read it cannot tell the difference and change what they install, so say
      # it explicitly. Quoted: bare yes is a YAML 1.1 boolean and would reach the
      # container as "true", silently inverting every [ "$SPLIT_BUILD" = "yes" ].
      SPLIT_BUILD: "yes"
      # Compiled into emulationstation (see its pre_configure_target). Passing
      # them here means the ES this job builds is the one that ships, so the
      # image job no longer has to clean and rebuild it -- ~19m of its 49m.
      # A rotated key still forces a rebuild: ES sets PKG_STAMP from these.
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        run: |
          tar --zstd -xf build.aarch64-toolchain.tar.zst

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      # es4all: the cache is per-board, because the tree is. BOARD picks which
      # dtbs the kernel builds, that list lands in linux's PKG_STAMP, and the
      # stamp lands in the tree -- so two boards genuinely produce different
      # trees. The fingerprint below already knows that (BOARD is in it), so a
      # second board correctly misses; but without the board in the *name* it
      # would then republish over the first board's tree, and the two would take
      # turns evicting each other and neither would ever hit.
      #
      # Naming mirrors the image branding in build-aarch64-image (rk3566-md1000
      # -> MD1000) rather than inventing a second scheme. Only a single BOARD
      # names a model; blank (= every board under DEVICE) or several is "all",
      # which is exactly when the image is not model-specific either.
      - name: Compute board slug
        id: slug
        run: |
          if [ "$(echo '${{ inputs.BOARD }}' | wc -w)" -eq 1 ]; then
            SLUG=$(echo '${{ inputs.BOARD }}' | sed 's/^rk[0-9]*-//' | tr '[:lower:]' '[:upper:]')
          else
            SLUG=all
          fi
          echo "SLUG=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "board slug: ${SLUG}"

      # es4all: restore the tree this job published last time, so build_distro
      # rebuilds only what actually changed instead of the whole userland (~80m).
      # The stamps already handle per-package changes correctly -- scripts/build
      # re-derives PKG_DEEPHASH from each package's own files and rebuilds on
      # mismatch, so a bumped es4all pin still recompiles ES.
      #
      # What stamps do NOT cover is the build config: calculate_stamp hashes a
      # package's files and nothing else -- not options, not the env. Restoring a
      # tree built under a different config therefore hands build_distro a set of
      # stamps that claim work is done which was done differently. That is
      # exactly how the earlier attempt at this failed, and it failed silently
      # for 40 minutes before dying. So the tree is keyed on a fingerprint of
      # everything the stamps are blind to, and a mismatch means a full build.
      #
      # The toolchain stamps go into the fingerprint too, which is why this runs
      # after the toolchain artifact is unpacked: a match then guarantees the
      # tree was built against this very toolchain, so letting the tree's own
      # copy land on top of it is a no-op rather than a downgrade.
      - name: Compute config fingerprint
        id: fp
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          TC=$(for s in "${BT}"/.stamps/*/build_*; do
                 [ -f "$s" ] || continue
                 printf '%s %s\n' "$s" "$(sed -n 's/^STAMP_PKG_DEEPHASH=//p' "$s")"
               done | LC_ALL=C sort | sha256sum | cut -c1-16)
          FP=$( { cat projects/${{ inputs.PROJECT }}/options \
                      projects/${{ inputs.PROJECT }}/devices/${{ inputs.DEVICE }}/options \
                      distributions/${{ inputs.PROJECT }}/options \
                      projects/${{ inputs.PROJECT }}/packages/virtual/*/package.mk 2>/dev/null
                  echo "ED=${EMULATION_DEVICE} E32=${ENABLE_32BIT} MP=${MODULES_PKG} SB=${SPLIT_BUILD}"
                  echo "P=${{ inputs.PROJECT }} D=${{ inputs.DEVICE }} B=${{ inputs.BOARD }} A=${ARCH}"
                  echo "TC=${TC} BUST=${{ vars.CACHE_BUST }}"
                } | sha256sum | cut -c1-16 )
          echo "FP=${FP}" >> "$GITHUB_OUTPUT"
          echo "config fingerprint: ${FP}  (toolchain=${TC})"

      - name: Restore userland-tree
        id: ult_restore
        run: |
          CACHE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/userland-tree"
          WANT="${{ steps.fp.outputs.FP }}"
          HAVE=$(curl -L --fail --silent "${CACHE}/userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.fp" 2>/dev/null || echo "")
          echo "want=${WANT}  cached=${HAVE:-<none>}"
          if [ -z "${HAVE}" ] || [ "${HAVE}" != "${WANT}" ]; then
            echo "::notice::config fingerprint does not match the cached tree -> full userland build"
            exit 0
          fi
          rm -f ult.tar.zst; i=0
          while :; do
            SUF=$(printf "%02d" "$i")
            if curl -L --fail --retry 3 -o part "${CACHE}/userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.tar.zst.part${SUF}" 2>/dev/null; then
              cat part >> ult.tar.zst; rm -f part; i=$((i+1))
            else
              break
            fi
          done
          if [ "$i" -eq 0 ] || ! tar --zstd -tf ult.tar.zst >/dev/null 2>&1; then
            rm -f ult.tar.zst
            echo "::warning::cached tree missing or corrupt -> full userland build"
            exit 0
          fi
          tar --zstd -xf ult.tar.zst && rm -f ult.tar.zst
          echo "reused=1" >> "$GITHUB_OUTPUT"
          echo "restored userland tree from $i part(s); build_distro will rebuild only what changed"
        continue-on-error: true

      - name: Retrieve ccache
        if: steps.ult_restore.outputs.reused != '1'
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_distro "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-base-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Build modules
        if: ${{ inputs.DEVICE == 'RK3326' || inputs.DEVICE == 'H700' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt modules "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-modules)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-modules
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.ult_restore.outputs.reused != '1'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.ult_restore.outputs.reused != '1'
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache

      - name: Save ccache
        if: steps.ult_restore.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files \
          -cf build.build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build
          sudo tar --remove-files \
          -cf build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: build.aarch64.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 build (${{ inputs.DEVICE }})
          path: build.build.aarch64.tar
          if-no-files-found: error

      # es4all: publish this tree as userland-tree, which the B lane
      # (build-es-image) restores so it can recompile ES alone instead of
      # running this 80m job. Nothing published it before -- it had to be
      # hand-seeded -- so it sat 10 days stale while the B lane quietly built
      # ES against an old sysroot. This is what keeps it fresh.
      #
      # build.aarch64.tar is already exactly the right content: the Compress
      # step above pulled build/ into its own tar first (--remove-files),
      # leaving toolchain + populated sysroot + .stamps, which is what the B
      # lane's restore expects.
      - name: Stage tree as userland-tree (for the B lane)
        id: ult
        run: |
          zstd -T0 -12 -f build.aarch64.tar -o ult.tar.zst
          split -b 1900m -d --suffix-length=2 ult.tar.zst \
            "userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.tar.zst.part"
          rm -f ult.tar.zst
          echo "${{ steps.fp.outputs.FP }}" > "userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.fp"
          ls -la userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.tar.zst.part* \
                 userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.fp
        continue-on-error: true

      # The B lane reads parts by walking .part00, .part01, ... until one 404s,
      # so a leftover part from a larger previous snapshot would be concatenated
      # onto a smaller new one and silently corrupt it. Drop only the parts this
      # upload will not replace -- the ones it will replace are left alone, so a
      # failed upload cannot leave the cache emptied.
      - name: Drop stale userland-tree parts
        if: steps.ult.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CACHE: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          NEW=$(ls userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.tar.zst.part* 2>/dev/null | xargs -n1 basename)
          echo "new parts:"; echo "${NEW}"
          gh release view userland-tree -R "${CACHE}" --json assets -q '.assets[].name' 2>/dev/null \
            | grep "^userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}\.tar\.zst\.part" \
            | while read -r a; do
                if ! echo "${NEW}" | grep -qx "$a"; then
                  echo "dropping stale ${a}"
                  gh release delete-asset userland-tree "$a" -R "${CACHE}" -y || true
                fi
              done
        continue-on-error: true

      - name: Save userland-tree
        if: steps.ult.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: userland-tree
          files: "userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.tar.zst.part*"
          make_latest: false
          prerelease: true
          body: userland build tree snapshot (toolchain + sysroot + .stamps, minus build/). Consumed by the B lane, and by this job to skip rebuilding an unchanged userland.
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      # Publish the fingerprint only after the tree itself is up. It is the gate
      # the next run gates its restore on, so if it landed first and the tree
      # upload then failed, that run would read a matching fingerprint and pull
      # down a stale or half-written tree.
      - name: Save userland-tree fingerprint
        if: steps.ult.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: userland-tree
          files: "userland-tree-aarch64-${{ inputs.DEVICE }}-${{ steps.slug.outputs.SLUG }}.fp"
          make_latest: false
          prerelease: true
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
