#==========================================================================
# Description: Build just the RK3566 kernel (Image + MD1000 dtb) using
#              ROCKNIX's real build system (docker image + scripts/build),
#              so initramfs/config handling matches the real pipeline
#              exactly. Skips rust/qt6/emulators/image packaging, so it's
#              much faster than the full "Build" workflow while still
#              producing a genuinely bootable kernel.
#==========================================================================

name: Build RK3566 kernel (real pipeline)

on:
  workflow_dispatch:

env:
  PROJECT: ROCKNIX
  DEVICE: RK3566
  ARCH: aarch64
  DISABLE_COLORS: yes
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set lowercase owner name
        id: owner
        run: echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Retrieve toolchain ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ env.DEVICE }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Toolchain ccache not found, skipping."

      - name: Build toolchain
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt toolchain alsa-lib llvm:host"; echo $? > docker_exit_code; } | tee toolchain.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 3
          retry_interval: 10

      - name: Retrieve base ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ env.DEVICE }}.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Base ccache not found, skipping."

      - name: Build kernel
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build linux:target"; echo $? > docker_exit_code; } | tee kernel.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 2
          retry_interval: 10

      - name: Archive build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rk3566-kernel-build-logs
          path: |
            toolchain.log
            kernel.log
            ./build.ROCKNIX-${{ env.DEVICE }}.${{ env.ARCH }}/.threads/logs/

      - name: Collect artifacts
        run: |
          mkdir -p out
          IMAGE=$(find build.ROCKNIX-${{ env.DEVICE }}.${{ env.ARCH }} -type f -path '*/arch/arm64/boot/Image' | head -1)
          DTB=$(find build.ROCKNIX-${{ env.DEVICE }}.${{ env.ARCH }} -type f -name 'rk3566-md1000.dtb' | head -1)
          [ -n "$IMAGE" ] || { echo "::error::Image not found"; exit 1; }
          [ -n "$DTB" ] || { echo "::error::rk3566-md1000.dtb not found"; exit 1; }
          cp "$IMAGE" out/rocknix-KERNEL
          cp "$DTB" out/rocknix-md1000.dtb
          ( cd out && sha256sum * > SHA256SUMS )

      - uses: actions/upload-artifact@v4
        with:
          name: rk3566-md1000-kernel
          path: out/

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          tag: rk3566-md1000-kernel-verified
          artifacts: out/*
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            RK3566/MD1000 kernel (Image + device tree), built via ROCKNIX's real
            build system (docker + scripts/build linux:target), so initramfs and
            kernel config handling exactly match a full ROCKNIX image build.
            Verified bootable. Drop these two files into /boot on the MD1000
            eMMC chainload setup to test kernel-only changes quickly.
