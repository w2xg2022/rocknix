name: Build device

on:
  workflow_call:
    inputs:
      PROJECT:
        description: "The project name"
        type: string
        required: true
      DEVICE:
        description: "The device name"
        type: string
        required: true
      OWNER_LC:
        description: "repo owner name"
        type: string
        required: true
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      BOARD:
        description: "space-separated <file> basenames to narrow the dtb build to (blank = build every board under DEVICE)"
        type: string
        required: false
        default: ""

jobs:
  build-arm:
    uses: ./.github/workflows/build-arm.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      BOARD: ${{ inputs.BOARD }}

  build-aarch64-toolchain:
    uses: ./.github/workflows/build-aarch64-toolchain.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      BOARD: ${{ inputs.BOARD }}

  build-aarch64-rust:
    needs: build-aarch64-toolchain
    # es4all: RK3566 唯一的 rust 消费者 touchhle-sa 已从 virtual/emulators 移除,
    # 故整个 rust 工具链免编。emu-standalone 用 always() 容忍此 skip,且其 rust
    # 下载步骤也已排除 RK3566。
    if: ${{ inputs.DEVICE != 'RK3566' }}
    uses: ./.github/workflows/build-aarch64-rust.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64:
    needs: build-aarch64-toolchain
    uses: ./.github/workflows/build-aarch64.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      BOARD: ${{ inputs.BOARD }}

  # build-aarch64-mame-lr disabled: the full-MAME libretro core (mame_libretro.so)
  # is a ~4h build on the critical path and we don't use it (we use
  # mame2003_plus/mame2010 which build in emu-libretro). mame-lr source is kept
  # (packages/emulators/libretro/mame-lr); re-enable by reverting this commit.

  build-aarch64-qt6:
    needs: build-aarch64
    # es4all: RK3566 (Mali-G52) 上所有 qt6 消费者(PS2/PSV/3DS/GC-Wii 独立模拟器)
    # 都跑不动、已从 virtual/emulators 移除,故整个 qt6 免编。下游 emu-* job 用
    # always() 容忍此 skip;emu-libretro/standalone 里 qt6 下载也已排除 RK3566。
    if: ${{ inputs.DEVICE != 'RK3566' }}
    uses: ./.github/workflows/build-aarch64-qt6.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  # es4all: BOARD has to reach these two as well. They never build a dtb, but
  # something in the emulator dependency closure pulls in `linux`, and the kernel
  # is one of the few packages that sets PKG_STAMP -- from KERNEL_MAKE_EXTRACMD,
  # which is the dtb list that get_kernel_make_extracmd() derives from BOARD.
  # Without BOARD these jobs compute "every dtb under this DEVICE" (17 of them on
  # RK3566) where build-aarch64 computed just "rk3566-md1000.dtb", so the stamp
  # never matches and each of them recompiles the whole kernel -- measured at 36m
  # of emu-libretro's 50m on run 29571456282, building 16 dtbs it will never use.
  # It then leaves that all-dtb stamp in the tree, so build-aarch64-image (which
  # does have BOARD) disagrees in turn and compiles the kernel a third time.
  #
  # It was never wrong, only wasteful: every rebuild is a valid kernel, and the
  # one that ships is the image job's. It stayed invisible because the emulators'
  # own compile time hid it -- it only surfaced once emu-slice made them free.
  build-aarch64-emu-libretro:
    needs:
      - build-aarch64
      - build-aarch64-qt6
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-libretro.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      BOARD: ${{ inputs.BOARD }}

  build-aarch64-emu-standalone:
    needs:
      - build-aarch64
      - build-aarch64-qt6
      - build-aarch64-rust
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-standalone.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      BOARD: ${{ inputs.BOARD }}

  build-aarch64-image:
    needs:
      - build-aarch64-emu-libretro
      - build-aarch64-emu-standalone
      - build-arm
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-image.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
      BOARD: ${{ inputs.BOARD }}

  purge-artifact:
    name: Artifacts cleanup
    needs: build-aarch64-image
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    runs-on: ubuntu-24.04
    steps:
      - uses: geekyeggo/delete-artifact@v6
        continue-on-error: true
        with:
          name: |
            aarch64 (${{ inputs.DEVICE }})
            aarch64 build (${{ inputs.DEVICE }})
            aarch64-rust (${{ inputs.DEVICE }})
            aarch64-toolchain (${{ inputs.DEVICE }})
            arm (${{ inputs.DEVICE }})
            emu-libretro (${{ inputs.DEVICE }})
            emu-standalone (${{ inputs.DEVICE }})
            qt6 (${{ inputs.DEVICE }})
          failOnError: false    
