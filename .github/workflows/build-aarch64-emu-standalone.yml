name: Build emu-standalone

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BOARD:
        required: false
        type: string
        default: ""

jobs:
  build-aarch64-emu-standalone:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      TARGET_TYPE: emus_only
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      # Same as emu-libretro: no dtb is built here, but `linux` is in the closure
      # and its PKG_STAMP carries the dtb list, so an unset BOARD makes the stamp
      # disagree with build-aarch64's and recompiles the kernel for nothing.
      BOARD: ${{ inputs.BOARD }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.aarch64.tar

      - name: Download build aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 build (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64 build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.build.aarch64.tar

      # es4all: RK3566 免编 rust(无消费者),故跳过 rust artifact 下载/解压。
      - name: Download aarch64-rust (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'RK3566' }}
        uses: actions/download-artifact@v8
        with:
          name: aarch64-rust (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-rust
        if: ${{ inputs.DEVICE != 'RK3566' }}
        run: |
          tar --zstd -xf build.aarch64-rust.tar.zst

      - name: Clean up compressed aarch64-rust file
        if: ${{ inputs.DEVICE != 'RK3566' }}
        run: rm build.aarch64-rust.tar.zst

      - name: Download qt6 (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' || inputs.DEVICE == 'SM6115' }}
        uses: actions/download-artifact@v8
        with:
          name: qt6 (${{ inputs.DEVICE }})

      - name: Extract artifact qt6
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' || inputs.DEVICE == 'SM6115' }}
        run: |
          sudo tar --zstd -xf build.qt6.tar.zst --same-owner

      - name: Clean up compressed qt6 file
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM6115' }}
        run: rm build.qt6.tar.zst

      # === es4all: emulator slice reuse =========================================
      # See build-aarch64-emu-libretro.yml for the full rationale. In short: the
      # userland tree we just extracted provably contains no emulator packages
      # (build-aarch64 runs with EMULATION_DEVICE=no), so the set difference over
      # .stamps/ isolates exactly the emulators this job builds, and restoring
      # only those can never clobber this run's userland.
      - name: Snapshot the userland package set
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          ls "${BT}/.stamps" 2>/dev/null | LC_ALL=C sort > /tmp/ul-stamps.txt || : > /tmp/ul-stamps.txt
          echo "userland packages in tree: $(wc -l < /tmp/ul-stamps.txt)"

      - name: Compute emulator cache key
        id: key
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          # emulationstation and rocknix are excluded: nothing in the tree depends
          # on either, and they are the two packages we edit most, so excluding
          # them is what lets an es4all pin bump reuse the emulators instead of
          # rebuilding them for an hour. Any other package changing moves the key.
          UL_ID=$(for s in "${BT}"/.stamps/*/build_target; do
                    [ -f "$s" ] || continue
                    p=$(basename "$(dirname "$s")")
                    case "$p" in emulationstation|rocknix) continue ;; esac
                    printf '%s %s\n' "$p" "$(sed -n 's/^STAMP_PKG_DEEPHASH=//p' "$s")"
                  done | LC_ALL=C sort | sha256sum | cut -c1-16)
          EMU_FP=$( { cat projects/${{ inputs.PROJECT }}/packages/virtual/emulators/package.mk \
                          projects/${{ inputs.PROJECT }}/options \
                          projects/${{ inputs.PROJECT }}/devices/${{ inputs.DEVICE }}/options 2>/dev/null
                      echo "TT=${TARGET_TYPE} E32=${ENABLE_32BIT} DEV=${{ inputs.DEVICE }} ARCH=${ARCH} BUST=${{ vars.CACHE_BUST }}"
                    } | sha256sum | cut -c1-16)
          echo "KEY=${UL_ID}-${EMU_FP}" >> "$GITHUB_OUTPUT"
          echo "emu cache key: ${UL_ID}-${EMU_FP}  (userland=${UL_ID} config=${EMU_FP})"

      - name: Restore emulator slice
        id: slice
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/emu-slice"
          NAME="emu-slice-standalone-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar"
          found=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            curl -L --fail --silent --show-error -o "slice.part-${suffix}" "${BASE}/${NAME}.part-${suffix}" || break
            found=1
          done
          if [ "$found" -eq 0 ]; then
            rm -f slice.part-*
            echo "::notice::no emulator slice for this key -> building from source"
            exit 0
          fi
          cat slice.part-* > slice.tar && rm -f slice.part-*
          tar -tf slice.tar >/dev/null || { echo "::warning::slice corrupt -> building from source"; rm -f slice.tar; exit 0; }
          tar -xf slice.tar && rm -f slice.tar
          echo "reused=1" >> "$GITHUB_OUTPUT"
          echo "restored emulator packages:"
          comm -13 /tmp/ul-stamps.txt <(ls "${BT}/.stamps" | LC_ALL=C sort) | tr '\n' ' '; echo
        continue-on-error: true

      - name: Retrieve ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache"
          PREFIX="ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            echo "Trying $URL"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              echo "No more parts found at $URL"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "No cache found, skipping."
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          tar -xf ccache.tar || { echo "Extract failed"; exit 0; }
          rm -f ${PREFIX}* ccache.tar

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env -e USER=docker --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt emulators"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-emu-standalone)
        # es4all: was failure() -- which meant .threads/logs (the per-package
        # build timings) only ever survived a broken build. They are the only
        # direct evidence of where a green build actually spends its time, and
        # a green build is exactly the one you want to speed up. purge-artifact
        # does not touch output.logs-*, so these keep the usual 90 days.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-emu-standalone)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      # Publish the slice for the next run: only the packages whose stamps were
      # absent from the userland tree we started from, i.e. exactly this lane's
      # emulators. Keeping the userland out is what makes a later restore unable
      # to overwrite a freshly built userland package.
      - name: Publish emulator slice
        if: steps.slice.outputs.reused != '1'
        run: |
          BT=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64
          comm -13 /tmp/ul-stamps.txt <(ls "${BT}/.stamps" | LC_ALL=C sort) > /tmp/emu-pkgs.txt
          if [ ! -s /tmp/emu-pkgs.txt ]; then
            echo "::warning::no emulator packages appeared -> nothing to publish"; exit 0
          fi
          echo "publishing $(wc -l < /tmp/emu-pkgs.txt) emulator packages"
          : > /tmp/slice-files.txt
          while read -r p; do
            echo "${BT}/.stamps/${p}" >> /tmp/slice-files.txt
            for d in "${BT}"/install_pkg/"${p}"-*; do
              # `|| continue`, not `&& echo`: with the default `bash -e`, an
              # unmatched glob would make the AND-list the loop's failing last
              # command and abort the step.
              [ -e "$d" ] || continue
              echo "$d" >> /tmp/slice-files.txt
            done
          done < /tmp/emu-pkgs.txt
          sudo tar -cf - -T /tmp/slice-files.txt \
            | split -b 1900m - "emu-slice-standalone-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar.part-"
          ls -la emu-slice-*.part-* || true
        continue-on-error: true

      - name: Save emulator slice
        if: steps.slice.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: emu-slice
          files: "emu-slice-standalone-${{ inputs.DEVICE }}-${{ steps.key.outputs.KEY }}.tar.part-*"
          make_latest: false
          prerelease: true
          body: emulator build slices, keyed by userland+config fingerprint
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Clean up slice parts
        if: always()
        run: rm -f emu-slice-*.tar.part-*

      - name: Clean ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 4.5G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.slice.outputs.reused != '1'
        run: |
          tar --remove-files -cf - ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache \
            | split -b 1900m - ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-

      - name: Save ccache
        if: steps.slice.outputs.reused != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: "ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files -cf - \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain  | split -b 2G -  build.emu-standalone.tar.part

      - uses: actions/upload-artifact@v7
        with:
          name: emu-standalone (${{ inputs.DEVICE }})
          path: build.emu-standalone.tar.part*
          if-no-files-found: error
