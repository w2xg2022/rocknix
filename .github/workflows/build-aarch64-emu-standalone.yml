name: Build emu-standalone

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64-emu-standalone:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      TARGET_TYPE: emus_only
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve ccache
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache"
          PREFIX="ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
          
            echo "Trying $URL"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              echo "No more parts found at $URL"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "No cache found, skipping."
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          tar -xf ccache.tar || { echo "Extract failed"; exit 0; }
          rm -f ${PREFIX}* ccache.tar

      - name: Download aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.aarch64.tar

      - name: Download build aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 build (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64 build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.build.aarch64.tar

      # es4all: 复用上次的 emu-standalone 树(模拟器 + .stamps)，但★绑定 userland 身分★。
      #
      # 为什么要绑：config/functions 的 calculate_stamp 只 hash 套件「自己」的 PKG_DIR /
      # patches / PKG_NEED_UNPACK —— 依赖被重编「不会」让依赖者的 stamp 失效。所以若无脑
      # 复用旧 emu 树，一旦 userland(SDL2/mesa/…)改版重编，模拟器的 stamp 没变会被跳过，
      # 留下连结旧库的陈旧 binary(= EmuELEC 註解警告的 ABI 耦合)。
      #
      # 故以 userland 身分(刚解压的 aarch64 树里所有 build_target stamp 内容的 hash)当 key：
      # 身分相同 -> userland 没动 -> 安全复用，模拟器整包跳过；身分不同 -> userland 变了
      # -> 不复用、全量重编。自动判断，不靠人记得手动清 cache。
      - name: Reuse emu-standalone tree (keyed to userland id)
        id: emutree
        if: ${{ vars.TREE_REUSE == 'on' }}
        run: |
          BT="build.ROCKNIX-${{ inputs.DEVICE }}.aarch64"
          UL_ID=$(cat $(find "${BT}/.stamps" -name 'build_target' | sort) 2>/dev/null | sha256sum | cut -c1-16)
          echo "userland id = ${UL_ID}"
          echo "ul_id=${UL_ID}" >> "$GITHUB_OUTPUT"
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/emu-tree/emu-standalone-${{ inputs.DEVICE }}"
          WANT=$(curl -fsSL "${BASE}.id" 2>/dev/null || echo "")
          if [ -z "${WANT}" ] || [ "${WANT}" != "${UL_ID}" ]; then
            echo "no matching emu tree (cache id='${WANT}' current='${UL_ID}') -> full standalone build"
            echo "reused=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rm -f emu.tar.zst; i=0
          while :; do
            SUF=$(printf "%02d" "$i")
            if curl -L --fail --retry 3 -o part "${BASE}.tar.zst.part${SUF}" 2>/dev/null; then
              cat part >> emu.tar.zst; rm -f part; i=$((i+1))
            else
              break
            fi
          done
          if [ "$i" -gt 0 ] && tar --zstd -tf emu.tar.zst >/dev/null 2>&1; then
            tar --zstd -xf emu.tar.zst && rm -f emu.tar.zst
            echo "reused=1" >> "$GITHUB_OUTPUT"
            echo "restored emu-standalone tree (userland id ${UL_ID}) -> unchanged emulators will be skipped"
          else
            rm -f emu.tar.zst
            echo "reused=0" >> "$GITHUB_OUTPUT"
            echo "emu tree missing/corrupt -> full standalone build"
          fi

      # es4all: RK3566 免编 rust(无消费者),故跳过 rust artifact 下载/解压。
      - name: Download aarch64-rust (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'RK3566' }}
        uses: actions/download-artifact@v8
        with:
          name: aarch64-rust (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-rust
        if: ${{ inputs.DEVICE != 'RK3566' }}
        run: |
          tar --zstd -xf build.aarch64-rust.tar.zst

      - name: Clean up compressed aarch64-rust file
        if: ${{ inputs.DEVICE != 'RK3566' }}
        run: rm build.aarch64-rust.tar.zst

      - name: Download qt6 (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' || inputs.DEVICE == 'SM6115' }}
        uses: actions/download-artifact@v8
        with:
          name: qt6 (${{ inputs.DEVICE }})

      - name: Extract artifact qt6
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' || inputs.DEVICE == 'SM6115' }}
        run: |
          sudo tar --zstd -xf build.qt6.tar.zst --same-owner

      - name: Clean up compressed qt6 file
        if: ${{ inputs.DEVICE == 'RK3399' || inputs.DEVICE == 'RK3576' || inputs.DEVICE == 'RK3588' ||
          inputs.DEVICE == 'S922X'  || inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM6115' }}
        run: rm build.qt6.tar.zst

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env -e USER=docker --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt emulators"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-emu-standalone)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-emu-standalone)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 4.5G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar --remove-files -cf - ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache \
            | split -b 1900m - ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-

      - name: Save ccache
        uses: softprops/action-gh-release@v3 
        with:
          tag_name: ccache
          files: "ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone.tar.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files -cf - \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain  | split -b 2G -  build.emu-standalone.tar.part

      - uses: actions/upload-artifact@v7
        with:
          name: emu-standalone (${{ inputs.DEVICE }})
          path: build.emu-standalone.tar.part*
          if-no-files-found: error

      # es4all: 把这次的 emu-standalone 树发回 distribution-cache，并连同它所对应的
      # ★userland 身分★(.id)一起发 —— 下次只有在 userland 身分相同时才会被复用。
      # 一律发布(即使这次是复用来的)：模拟器自身 package.mk 若改过，本次会重编它、
      # 树内容已变，必须更新；userland 没变时内容相同、覆盖也无害。
      - name: Publish emu-standalone tree (keyed to userland id)
        if: ${{ vars.TREE_REUSE == 'on' }}
        run: |
          cat build.emu-standalone.tar.part* | zstd -T0 -3 -c > emu.tar.zst
          split -b 1900m -d --suffix-length=2 emu.tar.zst emu-standalone-${{ inputs.DEVICE }}.tar.zst.part
          rm -f emu.tar.zst
          echo "${{ steps.emutree.outputs.ul_id }}" > emu-standalone-${{ inputs.DEVICE }}.id
          ls -la emu-standalone-${{ inputs.DEVICE }}.*
        continue-on-error: true
      - uses: softprops/action-gh-release@v3
        if: ${{ vars.TREE_REUSE == 'on' }}
        with:
          tag_name: emu-tree
          files: |
            emu-standalone-${{ inputs.DEVICE }}.tar.zst.part*
            emu-standalone-${{ inputs.DEVICE }}.id
          make_latest: false
          prerelease: true
          body: prebuilt emulator trees, keyed to the userland id they were built against
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
